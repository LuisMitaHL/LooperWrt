# Do not edit, changes to this file will be lost on upgrades
# /etc/sysctl.conf can be used to customize sysctl settings

net.netfilter.nf_conntrack_acct=1
# LooperWrt: verify L4 checksums on ingress so corrupted packets are marked
# INVALID and never enter conntrack (upstream ships 0, a 2009 performance
# tweak). Without it a corrupted packet is forwarded, the client's TCP stack
# re-segments it below TLS and the stream fails with "decryption failed or bad
# record mac" instead of being dropped and retransmitted. See
# research/nf-conntrack-checksum-default.md.
net.netfilter.nf_conntrack_checksum=1
net.netfilter.nf_conntrack_tcp_timeout_established=7440
net.netfilter.nf_conntrack_udp_timeout=60
net.netfilter.nf_conntrack_udp_timeout_stream=180
