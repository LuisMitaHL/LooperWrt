# Crash capture for the MT7981 AP hang investigation.
#
# Tier-1 detectors are compiled in through configs/target-aurora.config; their
# records land in the ramoops region reserved in the board DTS. Turn a detected
# stall into a panic so the kernel log is written to RAM and the AP reboots
# itself instead of needing a physical power cycle.
#
# Everything stays in RAM: no persistent logging. Read the records after the
# AP comes back from /sys/fs/pstore/.
#
# See research/mt7981-ap-hang-investigation.md in laotrared-router-platform.

kernel.softlockup_panic = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.hardlockup_panic = 1
kernel.hardlockup_all_cpu_backtrace = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 60
kernel.wq_watchdog = 1
kernel.panic_on_rcu_stall = 1
# Dump tasks, memory, timers, locks, all-CPU backtraces and blocked tasks.
kernel.panic_print = 0xff
# Give the panic path time to finish the dump before resetting.
kernel.panic = 10
